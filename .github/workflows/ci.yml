name: CI

# Quality gate: runs the same `make verify` you should run locally.
# If this is green, the architecture, formatting, lint, types, tests
# and build are all healthy.
#
# Heavy checks (LibreOffice roundtrip, Playwright E2E) live in dedicated
# jobs so they fail independently and don't block the core gate when
# they have an environment problem.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (quality gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: make verify

      - name: Upload roundtrip gate artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roundtrip-gate
          path: .tmp/roundtrip-gate
          if-no-files-found: ignore

      # Surface helpful diffs when format-check fails — makes the failure
      # easy to act on without re-running locally.
      - name: Show prettier diff on failure
        if: failure()
        run: pnpm exec prettier --list-different "**/*.{ts,tsx,js,jsx,json,md,yml,yaml}" || true

  docx-libreoffice-roundtrip:
    name: docx libreoffice roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The roundtrip script imports the built @officeai/docx dist; build
      # the workspace once so the dynamic import resolves.
      - name: Build packages
        run: pnpm build

      - name: Install LibreOffice (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-writer
          soffice --version

      - name: Roundtrip every DOCX fixture through LibreOffice
        run: make roundtrip-libre-docx

  xlsx-libreoffice-roundtrip:
    name: xlsx libreoffice roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The roundtrip script imports the built @officeai/xlsx dist; build
      # the workspace once so the dynamic import resolves.
      - name: Build packages
        run: pnpm build

      - name: Install LibreOffice (headless, with Calc)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-calc
          soffice --version

      - name: Roundtrip every XLSX fixture through LibreOffice
        run: make roundtrip-libre-xlsx

  pptx-libreoffice-roundtrip:
    name: pptx libreoffice roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The roundtrip script imports the built @officeai/pptx dist; build
      # the workspace once so the dynamic import resolves.
      - name: Build packages
        run: pnpm build

      - name: Install LibreOffice (headless, with Impress)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-impress
          soffice --version

      - name: Roundtrip every PPTX fixture through LibreOffice
        run: make roundtrip-libre-pptx

  web-e2e:
    name: web e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @officeai/web e2e:install

      - name: Run Playwright suite
        run: pnpm --filter @officeai/web e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results/sonaloop-visual-parity
          if-no-files-found: ignore

  docx-perf:
    name: docx perf budgets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The perf script imports the built @officeai/docx dist; build the
      # workspace once so the dynamic import resolves without an extra
      # in-script build step on cold cache.
      - name: Build packages
        run: pnpm build

      - name: Run DOCX perf budgets
        run: make perf-docx

  xlsx-perf:
    name: xlsx perf budgets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run XLSX perf budgets
        run: make perf-xlsx

  pptx-perf:
    name: pptx perf budgets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run PPTX perf budgets
        run: make perf-pptx

  docx-schema-validation:
    name: docx OOXML XSD validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Day-1 soft state: the ECMA-376 Transitional XSDs flag pre-existing
    # `mc:Ignorable` and `w15:*` extension attributes that the `docx` npm
    # generator emits (and we round-trip verbatim). The build log captures
    # the violations and the planned fixes; until those land we keep this
    # job advisory so a fresh PR isn't blocked on a known issue.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install xmllint (libxml2-utils)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils
          xmllint --version

      # The fetch script SHA-256-pins the source archive, so the cache key
      # only needs to track the script itself. A bump to URL/SHA invalidates
      # the cache automatically.
      - name: Cache OOXML XSD bundle
        uses: actions/cache@v4
        with:
          path: vendor/ooxml-xsd
          key: ooxml-xsd-${{ hashFiles('scripts/fetch-ooxml-xsd.mjs') }}

      - name: Fetch OOXML XSDs (cache miss only)
        run: make xsd-fetch

      # The validate script imports the built @officeai/docx + @officeai/core
      # dist. Build once so the dynamic import resolves.
      - name: Build packages
        run: pnpm build

      - name: Validate every DOCX fixture (input + agent re-emit) against wml.xsd
        run: make schema-validate-docx

  xlsx-schema-validation:
    name: xlsx OOXML XSD validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory until the XLSX serializer audit lands. ECMA-376 Transitional
    # flags pre-existing extension attributes (mc:Ignorable, x14ac:*) that
    # the upstream `xlsx` (SheetJS) emitter writes verbatim and we
    # round-trip without rewriting. The job artifact still surfaces every
    # violation so the follow-up audit has a precise hit list.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install xmllint (libxml2-utils)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils
          xmllint --version

      - name: Cache OOXML XSD bundle
        uses: actions/cache@v4
        with:
          path: vendor/ooxml-xsd
          key: ooxml-xsd-${{ hashFiles('scripts/fetch-ooxml-xsd.mjs') }}

      - name: Fetch OOXML XSDs (cache miss only)
        run: make xsd-fetch

      - name: Build packages
        run: pnpm build

      - name: Validate every XLSX fixture (input + agent re-emit) against sml.xsd
        run: make schema-validate-xlsx

  pptx-schema-validation:
    name: pptx OOXML XSD validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Advisory until the PPTX serializer audit lands. ECMA-376 Transitional
    # flags real (and known) violations such as `buSzPct` raw-percent values
    # that need the DML pattern fix. Captured as artifact for the follow-up.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install xmllint (libxml2-utils)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils
          xmllint --version

      - name: Cache OOXML XSD bundle
        uses: actions/cache@v4
        with:
          path: vendor/ooxml-xsd
          key: ooxml-xsd-${{ hashFiles('scripts/fetch-ooxml-xsd.mjs') }}

      - name: Fetch OOXML XSDs (cache miss only)
        run: make xsd-fetch

      - name: Build packages
        run: pnpm build

      - name: Validate every PPTX fixture (input + agent re-emit) against pml.xsd
        run: make schema-validate-pptx

  license-scan:
    name: license-graph SPDX scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan licenses
        run: make licenses
