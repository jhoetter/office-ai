name: Auto Release

# Mirrors hof-engine's auto-release flow, adapted for a Node monorepo
# distributed via GitHub Releases (NOT npm — see docs/release-pipeline.md):
#
#   1. CI gate (`pnpm verify`) on every push to main.
#   2. If green, compute the next patch version from the latest `vX.Y.Z`
#      tag, bump every publishable package in lockstep, commit, tag, push.
#   3. Build a self-contained `@officeai/agent` bundle via `pnpm deploy`
#      (resolves all `workspace:*` deps), tar it, and attach the tarball
#      to a new GitHub Release vX.Y.Z. Uses the standard GITHUB_TOKEN —
#      no npm org, no Trusted Publishers, no GHCR.
#   4. Notify hof-os by committing the new version into
#      `infra/officeai.lock.json` on jhoetter/hof-os, which kicks off
#      hof-os's own deploy pipeline (which curls the tarball from the
#      Release URL when building hof-skill-base-officeai).
#
# To bypass a release for a doc-only commit, append `[skip ci]` or
# `[skip release]` to the commit message.

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"

jobs:
  check:
    name: Verify (quality gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm verify

  release:
    name: Bump, Tag & Release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip release]')"
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      new_tag: ${{ steps.bump.outputs.new_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Check if current commit already tagged
        id: check_tag
        run: |
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync main, bump version, commit, push
        if: steps.check_tag.outputs.already_tagged == 'false'
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          release_commit_push() {
            git fetch origin main --tags
            git merge origin/main --no-edit
            LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
            CURRENT_VERSION="$(node -p "require('./package.json').version")"
            if [ -z "$LATEST_TAG" ]; then
              # First release: ship whatever version the workspace
              # already declares (defaults to 0.1.0 in every package
              # manifest). Bumping further on the first run would be
              # surprising — the tag/release should mark the version
              # the workspace ALREADY is at.
              NEW_VERSION="${CURRENT_VERSION}"
            else
              VERSION="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            fi
            echo "Releasing ${NEW_VERSION} (current workspace=${CURRENT_VERSION}, latest tag=${LATEST_TAG:-<none>})"
            node scripts/bump-version.mjs "${NEW_VERSION}"
            git add package.json packages/*/package.json
            if git diff --cached --quiet; then
              if [ -z "$LATEST_TAG" ]; then
                echo "First release at ${NEW_VERSION}; workspace already at this version, skipping bump commit"
              else
                echo "ERROR: expected version bump in workspace package.json files"
                exit 1
              fi
            else
              git commit -m "chore: bump to ${NEW_VERSION} [skip ci]"
              git push origin HEAD:main
            fi
            echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
            echo "new_tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          }

          if ! release_commit_push; then
            echo "First attempt failed (e.g. non-fast-forward); reset to origin/main and retry once"
            git fetch origin main --tags
            git reset --hard origin/main
            release_commit_push || exit 1
          fi

      - name: Tag and push
        if: steps.check_tag.outputs.already_tagged == 'false'
        run: |
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin "${{ steps.bump.outputs.new_tag }}"

      # The lockfile reflects the previous version's `workspace:*` linkage
      # in the resolved entries. After bumping, refresh it so `pnpm deploy`
      # resolves cleanly against the new versions.
      - name: Refresh lockfile after bump
        if: steps.check_tag.outputs.already_tagged == 'false'
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace
        if: steps.check_tag.outputs.already_tagged == 'false'
        run: pnpm build

      # Resolve every `workspace:*` dep of @officeai/agent into a fully
      # self-contained directory (with populated node_modules/) and tar it.
      # This is what the hof-os sandbox Dockerfile downloads + extracts —
      # no npm registry interaction needed at consume time.
      - name: Build release bundle (officeai-agent)
        if: steps.check_tag.outputs.already_tagged == 'false'
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.new_version }}"
          DEPLOY_DIR="${RUNNER_TEMP}/officeai-agent"
          rm -rf "${DEPLOY_DIR}"
          pnpm --filter @officeai/agent --prod deploy "${DEPLOY_DIR}"
          # Sanity check: bundled cli.js must exist + be a Node program.
          test -f "${DEPLOY_DIR}/dist/cli.js"
          head -1 "${DEPLOY_DIR}/dist/cli.js" | grep -q '^#!.*node'
          tar czf "officeai-agent-${VERSION}.tgz" -C "${RUNNER_TEMP}" officeai-agent
          ls -lh "officeai-agent-${VERSION}.tgz"

      # Same pattern for the React-editors / blanks bundle that hof-os
      # consumes inside its data-app SPA. `pnpm deploy` inlines the
      # @officeai/{docx,xlsx,pptx,pdf} deps so the tarball is fully
      # self-contained — hof-os doesn't need access to office-ai's
      # workspace at install time.
      - name: Build release bundle (officeai-react-editors)
        if: steps.check_tag.outputs.already_tagged == 'false'
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.new_version }}"
          DEPLOY_DIR="${RUNNER_TEMP}/officeai-react-editors"
          rm -rf "${DEPLOY_DIR}"
          pnpm --filter @officeai/react-editors --prod deploy "${DEPLOY_DIR}"
          # Sanity check: every subpath entry point hof-os imports
          # from must exist after the deploy.
          test -f "${DEPLOY_DIR}/dist/index.js"
          test -f "${DEPLOY_DIR}/dist/blanks/index.js"
          test -f "${DEPLOY_DIR}/dist/blanks/docx.js"
          test -f "${DEPLOY_DIR}/dist/blanks/xlsx.js"
          test -f "${DEPLOY_DIR}/dist/blanks/pptx.js"
          test -f "${DEPLOY_DIR}/dist/blanks/pdf.js"
          test -f "${DEPLOY_DIR}/dist/mime.js"
          test -f "${DEPLOY_DIR}/dist/contract.js"
          # Phase-1.5 bundled editor components — required for the
          # inline editor surface in hof-os' data-app SPA.
          test -f "${DEPLOY_DIR}/dist/components/docx.js"
          test -f "${DEPLOY_DIR}/dist/components/xlsx.js"
          test -f "${DEPLOY_DIR}/dist/components/pptx.js"
          test -f "${DEPLOY_DIR}/dist/components/pdf.js"
          test -f "${DEPLOY_DIR}/dist/components/docx.d.ts"
          test -f "${DEPLOY_DIR}/dist/components/xlsx.d.ts"
          test -f "${DEPLOY_DIR}/dist/components/pptx.d.ts"
          test -f "${DEPLOY_DIR}/dist/components/pdf.d.ts"
          # Optional public stylesheet — `dist/styles.css` is the
          # human-readable extract emitted by
          # `packages/react-editors/scripts/build-styles.mjs` for
          # hosts that want to load editor CSS via a `<link>` tag.
          # The bundled components don't depend on it (they
          # self-inject via the `officeai-css-inject` esbuild plugin
          # — assertions below).
          test -f "${DEPLOY_DIR}/dist/styles.css"
          # Catch the "bundled component lost its stylesheet" class
          # of regressions at release-build time. The Next.js host
          # gets editor CSS via Next's automatic `import "*.css"`
          # discovery; our esbuild bundle gets the same coverage via
          # the `officeai-css-inject` plugin in
          # `packages/react-editors/build.mjs`. If the plugin breaks,
          # a component entry drops a `.css` import, or a dep
          # upgrade makes a stylesheet vanish, the editors silently
          # revert to broken styling (xlsx cells stacked at one
          # pixel, docx losing ProseMirror selection chrome, pdf
          # losing text-layer absolute positioning + transparent
          # glyphs). Search each entry's transitive chunk graph for
          # a distinctive selector from each required stylesheet.
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const root = process.argv[1];
            function readGraph(entryRel) {
              const entry = path.join(root, entryRel);
              const seen = new Set([entry]);
              const queue = [entry];
              let blob = "";
              while (queue.length) {
                const f = queue.shift();
                const t = fs.readFileSync(f, "utf8");
                blob += t;
                const re = /from\s+["\x27]([^"\x27]+\.js)["\x27]/g;
                let m;
                while ((m = re.exec(t)) !== null) {
                  const next = path.join(path.dirname(f), m[1]);
                  if (!seen.has(next) && fs.existsSync(next)) {
                    seen.add(next);
                    queue.push(next);
                  }
                }
              }
              return blob;
            }
            const checks = [
              ["dist/components/xlsx.js", "XLSX", [".xlsx-grid-cell"]],
              ["dist/components/pptx.js", "PPTX", [".xlsx-grid-cell"]],
              ["dist/components/docx.js", "DOCX", [".xlsx-grid-cell", ".ProseMirror-selectednode"]],
              ["dist/components/pdf.js",  "PDF",  [".xlsx-grid-cell", ".officeai-pdf-text-layer"]],
            ];
            for (const [entry, label, needles] of checks) {
              const blob = readGraph(entry);
              for (const needle of needles) {
                if (!blob.includes(needle)) {
                  console.error(label + " bundle missing CSS selector: " + needle);
                  process.exit(1);
                }
              }
              console.log(label + " bundle CSS check OK (" + needles.join(", ") + ")");
            }
          ' "${DEPLOY_DIR}"
          test -d "${DEPLOY_DIR}/node_modules/@officeai/docx"
          test -d "${DEPLOY_DIR}/node_modules/@officeai/xlsx"
          test -d "${DEPLOY_DIR}/node_modules/@officeai/pptx"
          test -d "${DEPLOY_DIR}/node_modules/@officeai/pdf"
          # Shamefully-hoist the deploy output so consumers running with
          # `resolve.preserveSymlinks: true` (e.g. hof-os data-app/ui's
          # Vite) can resolve transitive deps. pnpm deploy nests them
          # under `.pnpm/<entry>/node_modules/<pkg>` and only hoists
          # declared direct deps — under preserveSymlinks the resolver
          # never crosses into `.pnpm/` so every transitive dep
          # (`@officeai/core`, `@e965/xlsx`, `pdf-lib`,
          # `fast-xml-parser`, `js-sha256`, …) is invisible. We mirror
          # `pnpm install --shamefully-hoist`'s effect by symlinking
          # every package found under `.pnpm/.../node_modules/` at the
          # top of `node_modules/`. Idempotent / first-wins on dupes.
          # Mirrors the self-healing fallback in hof-os's
          # `data-app/ui/scripts/ensure-officeai-react-editors.cjs`.
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const root = process.argv[1];
            const nm = path.join(root, "node_modules");
            const pnpmDir = path.join(nm, ".pnpm");
            if (!fs.existsSync(pnpmDir)) process.exit(0);
            let hoisted = 0;
            const seen = new Set();
            for (const entry of fs.readdirSync(pnpmDir)) {
              const inner = path.join(pnpmDir, entry, "node_modules");
              if (!fs.existsSync(inner)) continue;
              for (const pkg of fs.readdirSync(inner)) {
                if (pkg === ".bin") continue;
                if (pkg.startsWith("@")) {
                  let subs;
                  try { subs = fs.readdirSync(path.join(inner, pkg)); }
                  catch { continue; }
                  for (const sub of subs) {
                    const full = pkg + "/" + sub;
                    if (seen.has(full)) continue;
                    seen.add(full);
                    const target = path.join(nm, pkg, sub);
                    if (fs.lstatSync(target, { throwIfNoEntry: false })) continue;
                    fs.mkdirSync(path.dirname(target), { recursive: true });
                    fs.symlinkSync(path.relative(path.dirname(target), path.join(inner, pkg, sub)), target);
                    hoisted++;
                  }
                } else {
                  if (seen.has(pkg)) continue;
                  seen.add(pkg);
                  const target = path.join(nm, pkg);
                  if (fs.lstatSync(target, { throwIfNoEntry: false })) continue;
                  fs.symlinkSync(path.relative(path.dirname(target), path.join(inner, pkg)), target);
                  hoisted++;
                }
              }
            }
            console.log("Shamefully-hoisted " + hoisted + " package(s) into deploy root.");
          ' "${DEPLOY_DIR}"
          # Sanity check key transitives are now resolvable from the
          # deploy root (catches accidental breakage of the hoist step).
          # Includes both the agent-graph deps (pdf-lib, fast-xml-parser)
          # and the Phase-1.5 editor externals (pdfjs-dist, prosemirror-*,
          # lucide-react, jszip, yjs, y-websocket).
          test -d "${DEPLOY_DIR}/node_modules/@officeai/core"
          test -d "${DEPLOY_DIR}/node_modules/@officeai/pdf-engine"
          test -d "${DEPLOY_DIR}/node_modules/@officeai/ui"
          test -d "${DEPLOY_DIR}/node_modules/@officeai/comments"
          test -d "${DEPLOY_DIR}/node_modules/@officeai/realtime"
          test -d "${DEPLOY_DIR}/node_modules/@officeai/text-formatting"
          test -d "${DEPLOY_DIR}/node_modules/@officeai/design-tokens"
          test -d "${DEPLOY_DIR}/node_modules/pdf-lib"
          test -d "${DEPLOY_DIR}/node_modules/fast-xml-parser"
          test -d "${DEPLOY_DIR}/node_modules/pdfjs-dist"
          test -d "${DEPLOY_DIR}/node_modules/lucide-react"
          test -d "${DEPLOY_DIR}/node_modules/jszip"
          test -d "${DEPLOY_DIR}/node_modules/yjs"
          test -d "${DEPLOY_DIR}/node_modules/y-websocket"
          test -d "${DEPLOY_DIR}/node_modules/prosemirror-view"
          tar czf "officeai-react-editors-${VERSION}.tgz" -C "${RUNNER_TEMP}" officeai-react-editors
          ls -lh "officeai-react-editors-${VERSION}.tgz"

      - name: Publish GitHub Release
        if: steps.check_tag.outputs.already_tagged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.new_version }}"
          gh release create "v${VERSION}" \
            "officeai-agent-${VERSION}.tgz" \
            "officeai-react-editors-${VERSION}.tgz" \
            --title "v${VERSION}" \
            --generate-notes

  notify-hof-os:
    name: Notify hof-os of new release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: needs.release.outputs.new_version != ''
    steps:
      - name: Checkout hof-os
        uses: actions/checkout@v4
        with:
          repository: jhoetter/hof-os
          token: ${{ secrets.OFFICEAI_SYNC_TOKEN }}
          ref: main

      - name: Update officeai lockfile
        env:
          NEW_VERSION: ${{ needs.release.outputs.new_version }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p infra
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          AGENT_TARBALL="https://github.com/jhoetter/office-ai/releases/download/v${NEW_VERSION}/officeai-agent-${NEW_VERSION}.tgz"
          REACT_TARBALL="https://github.com/jhoetter/office-ai/releases/download/v${NEW_VERSION}/officeai-react-editors-${NEW_VERSION}.tgz"
          cat > infra/officeai.lock.json <<EOF
          {
            "version": "${NEW_VERSION}",
            "agent_version": "${NEW_VERSION}",
            "agent_tarball": "${AGENT_TARBALL}",
            "react_editors_version": "${NEW_VERSION}",
            "react_editors_tarball": "${REACT_TARBALL}",
            "published_at": "${PUBLISHED_AT}",
            "source_repo": "jhoetter/office-ai",
            "source_sha": "${GIT_SHA}"
          }
          EOF
          cat infra/officeai.lock.json

      - name: Commit and push
        env:
          NEW_VERSION: ${{ needs.release.outputs.new_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/officeai.lock.json
          if git diff --cached --quiet; then
            echo "officeai.lock.json already at ${NEW_VERSION}; nothing to commit"
            exit 0
          fi
          git commit -m "chore(officeai): bump to ${NEW_VERSION}"
          git pull --rebase origin main
          git push origin main

